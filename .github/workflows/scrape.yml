name: Scrape Hemmatco Blog

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Set to true to clear processed posts before scraping'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hemmatco-telegram-dispatch
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure state directory exists
        run: mkdir -p state

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_state || 'false' }}
        run: python -m hemmatco_scraper

      - name: Persist processed posts state
        if: always()
        run: |
          if [ ! -f state/processed_posts.json ]; then
            echo "No state file was produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/processed_posts.json
          if git diff --cached --quiet; then
            echo "State is already current"
            exit 0
          fi
          git commit -m "chore: persist scraper state [skip ci]"
          git push origin HEAD:master
